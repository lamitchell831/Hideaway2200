<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f6f3"/>
  
  <!-- Mountains -->
  <polygon points="0,200 80,120 160,180 240,100 320,160 400,120 400,300 0,300" fill="#6b7c5c" opacity="0.3"/>
  <polygon points="0,220 60,160 140,200 220,140 300,190 400,150 400,300 0,300" fill="#5a6b4a" opacity="0.5"/>
  
  <!-- Trees -->
  <polygon points="50,180 70,120 90,180" fill="#3d5c3d"/>
  <polygon points="340,190 360,130 380,190" fill="#3d5c3d"/>
  <polygon points="320,200 335,160 350,200" fill="#4a6b4a"/>
  
  <!-- Tiny House -->
  <!-- Main body -->
  <rect x="140" y="140" width="120" height="90" fill="#8b7355" rx="3"/>
  <!-- Roof -->
  <polygon points="130,140 200,80 270,140" fill="#5c4a3d"/>
  <!-- Door -->
  <rect x="180" y="170" width="40" height="60" fill="#4a3c2f"/>
  <circle cx="212" cy="200" r="3" fill="#d4af37"/>
  <!-- Window -->
  <rect x="150" y="155" width="25" height="25" fill="#a8c5e8" stroke="#4a3c2f" stroke-width="2"/>
  <line x1="162.5" y1="155" x2="162.5" y2="180" stroke="#4a3c2f" stroke-width="1.5"/>
  <line x1="150" y1="167.5" x2="175" y2="167.5" stroke="#4a3c2f" stroke-width="1.5"/>
  <!-- Porch railing -->
  <rect x="175" y="175" width="50" height="3" fill="#5c4a3d"/>
  <rect x="178" y="175" width="3" height="25" fill="#5c4a3d"/>
  <rect x="219" y="175" width="3" height="25" fill="#5c4a3d"/>
  
  <!-- Pond reflection -->
  <ellipse cx="200" cy="260" rx="80" ry="15" fill="#7da5c8" opacity="0.4"/>
  <ellipse cx="200" cy="258" rx="60" ry="10" fill="#9bbfd9" opacity="0.3"/>
  
  <!-- Text -->
  <text x="200" y="50" font-family="Georgia, serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#3d4a2f">Hideaway 2200</text>
  <text x="200" y="290" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6b6b6b">Asheville, NC</text>
</svg>