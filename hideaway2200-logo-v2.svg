<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for mountains -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5d4a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2d3a2d;stop-opacity:1"/>
    </linearGradient>
    <!-- Gradient for pond -->
    <linearGradient id="pondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7a9db0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5a7a8a;stop-opacity:1"/>
    </linearGradient>
    <!-- Gradient for sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e6e1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d4d0c8;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Clip path for oval -->
    <clipPath id="ovalClip">
      <ellipse cx="250" cy="150" rx="230" ry="140"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="300" fill="#f5f3ef"/>
  
  <!-- Oval frame background -->
  <ellipse cx="250" cy="150" rx="235" ry="145" fill="#d8d4cc"/>
  <ellipse cx="250" cy="150" rx="230" ry="140" fill="url(#skyGrad)"/>
  
  <!-- Content clipped to oval -->
  <g clip-path="url(#ovalClip)">
    <!-- Distant mountains -->
    <polygon points="20,180 80,100 140,160 200,80 280,140 360,90 420,150 480,110 500,200 500,300 0,300 0,200" fill="#6b7d6b" opacity="0.4"/>
    
    <!-- Mid mountains -->
    <polygon points="0,220 60,140 120,190 180,130 260,180 340,120 420,170 500,130 500,300 0,300" fill="url(#mountainGrad)"/>
    
    <!-- Forest silhouette at water's edge -->
    <path d="M 0,210 Q 30,200 60,208 Q 90,198 120,206 Q 150,196 180,204 Q 210,194 240,202 Q 270,192 300,200 Q 330,190 360,198 Q 390,188 420,196 Q 450,186 480,194 L 500,200 L 500,300 L 0,300 Z" fill="#1a2a1a" opacity="0.8"/>
    
    <!-- Pond water -->
    <rect x="0" y="205" width="500" height="95" fill="url(#pondGrad)"/>
    
    <!-- Subtle water ripples -->
    <ellipse cx="150" cy="235" rx="80" ry="8" fill="none" stroke="#8ab0c0" stroke-width="1" opacity="0.5"/>
    <ellipse cx="350" cy="250" rx="100" ry="10" fill="none" stroke="#8ab0c0" stroke-width="1" opacity="0.4"/>
    <ellipse cx="250" cy="265" rx="60" ry="5" fill="none" stroke="#8ab0c0" stroke-width="0.8" opacity="0.3"/>
    
    <!-- Mountain reflections in water (subtle) -->
    <polygon points="60,210 120,230 180,210" fill="#3d4a3d" opacity="0.15"/>
    <polygon points="340,210 420,235 480,210" fill="#3d4a3d" opacity="0.12"/>
  </g>
  
  <!-- Oval border -->
  <ellipse cx="250" cy="150" rx="230" ry="140" fill="none" stroke="#5a6b5a" stroke-width="3"/>
  
  <!-- Text -->
  <text x="250" y="70" font-family="Baskerville, Georgia, 'Times New Roman', serif" font-size="42" font-weight="normal" text-anchor="middle" fill="#2d3a2d" letter-spacing="2">Hideaway 2200</text>
  
  <!-- Subtitle with decorative lines -->
  <line x1="180" y1="245" x2="220" y2="245" stroke="#5a6b5a" stroke-width="1"/>
  <text x="250" y="250" font-family="Baskerville, Georgia, 'Times New Roman', serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#4a5a4a" letter-spacing="3">ASHEVILLE · NORTH CAROLINA</text>
  <line x1="280" y1="245" x2="320" y2="245" stroke="#5a6b5a" stroke-width="1"/>
</svg>