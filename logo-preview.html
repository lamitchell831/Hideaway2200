<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hideaway 2200 Logos</title>
  <style>
    body { font-family: Georgia, serif; background: #f5f5f5; padding: 40px; }
    .logo-container { background: white; padding: 30px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #3d4a2f; margin-top: 0; }
    .label { color: #666; font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Hideaway 2200 Logo Preview</h1>
  
  <div class="logo-container">
    <h2>Main Logo</h2>
    <img src="hideaway2200-logo.svg" width="400" alt="Hideaway 2200 Logo">
    <div class="label">Full horizontal logo (400×300) — for website header, business cards, signage</div>
  </div>
  
  <div class="logo-container">
    <h2>Icon / Favicon</h2>
    <img src="hideaway2200-icon.svg" width="150" alt="Hideaway 2200 Icon">
    <div class="label">Circular icon (200×200) — for social media profiles, favicon, app icons</div>
  </div>
  
  <div class="logo-container" style="background: #2a2a2a;">
    <h2 style="color: #f5f5f5;">Dark Background Test</h2>
    <img src="hideaway2200-logo.svg" width="300" alt="Hideaway 2200 Logo on Dark">
  </div>
</body>
</html>
